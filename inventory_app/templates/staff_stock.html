{% extends 'base.html' %}
{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="mb-0">担当者別台数</h1>
    <a href="{{ url_for('inventory') }}" class="btn btn-outline-secondary">在庫一覧</a>
  </div>

  <div class="table-responsive">
    <table class="table table-bordered table-hover align-middle table-sm">
      <thead class="table-dark">
        <tr>
          <th>担当者番号</th>
          <th class="text-center">担当台数</th>
          <th class="text-center">商品数</th>
          <th class="text-center">詳細</th>
        </tr>
      </thead>
      <tbody>
        {% for staff in staff_rows %}
          <tr>
            <td><strong>{{ staff.name }}</strong></td>
            <td class="text-center">{{ staff.total }}</td>
            <td class="text-center">{{ staff.product_count }}</td>
            <td class="text-center">
              <a href="{{ url_for('staff_stock_detail', staff_name=staff.name) }}" class="btn btn-sm btn-outline-primary">見る</a>
            </td>
          </tr>
        {% else %}
          <tr>
            <td colspan="4" class="text-center text-muted">担当者別台数のデータがありません。</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
