{% extends 'base.html' %}
{% block content %}
  <h1>Excel取込</h1>
  <p>対応する在庫シートを読み込み、Webの在庫データに登録します。</p>

  <form method="post" enctype="multipart/form-data" class="mb-4">
    <div class="mb-3">
      <label class="form-label">Excelファイル (.xlsx)</label>
      <input type="file" name="excel_file" accept=".xlsx" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">取込を実行</button>
  </form>

{% endblock %}
